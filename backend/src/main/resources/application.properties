# ---------------------------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------------------------
quarkus.application.name=maluma-fidelizacao-api
quarkus.rest.path=/api/v1
quarkus.http.port=8081
# Testes em porta aleatória: a padrão de teste (8081) é a mesma do contêiner do backend.
quarkus.http.test-port=0

quarkus.smallrye-openapi.info-title=Maluma Shoes - Fidelização de Clientes API
quarkus.smallrye-openapi.info-description=Histórico de vendas para o CRM de fidelização.
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.swagger-ui.always-include=true
# Swagger e /q/openapi desligados por padrão no contêiner (prod); SWAGGER_ENABLED=true no .env liga.
%prod.quarkus.swagger-ui.enabled=${SWAGGER_ENABLED:false}
%prod.quarkus.smallrye-openapi.enabled=${SWAGGER_ENABLED:false}
# Botão "Authorize" do Swagger: a chave vai no header X-API-Key.
quarkus.smallrye-openapi.security-scheme=api-key
quarkus.smallrye-openapi.api-key-parameter-in=header
quarkus.smallrye-openapi.api-key-parameter-name=X-API-Key

# Autenticação simples: chave única exigida no header X-API-Key (ApiKeyFilter). Sem API_KEY no
# .env o backend não sobe.
app.api-key=${API_KEY}
%test.app.api-key=chave-de-teste

# Fuso das datas recebidas nos filtros (data_inicio/data_fim chegam sem hora).
app.timezone=America/Sao_Paulo

# CORS para o frontend local (sobrescreva com CORS_ORIGINS, separado por vírgula).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Content-Type,X-API-Key

# Erros em Problem JSON (RFC 9457), sem stack trace na resposta.
quarkus.http-problem.include-details=false

quarkus.log.level=${LOG_LEVEL:INFO}

# ---------------------------------------------------------------------------------------------
# Banco de dados
# ---------------------------------------------------------------------------------------------
# A conexão só vale em dev e prod: nos testes o Quarkus Dev Services sobe um Postgres efêmero
# (Testcontainers) com o schema e a massa de src/test/resources/db/.
# Rodando o backend fora do Docker, use POSTGRES_HOST=localhost e POSTGRES_PORT=5433.
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=${POSTGRES_USER}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%dev,prod.quarkus.datasource.reactive.url=postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB}
quarkus.datasource.reactive.max-size=${DB_POOL_MAX:10}

# O schema é dos scripts de postgres-init/: o Hibernate nunca cria nem altera tabela.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.queries-slower-than-ms=100
# Datas lidas e devolvidas sempre em UTC (o "Z" do ISO 8601), seja qual for o fuso do servidor.
quarkus.hibernate-orm.jdbc.timezone=UTC
%test.quarkus.datasource.devservices.image-name=postgres:15-alpine
%test.quarkus.datasource.devservices.init-script-path=db/schema.sql,db/massa-de-teste.sql
